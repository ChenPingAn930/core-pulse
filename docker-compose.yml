version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: corepulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: pc_repair
      TZ: Asia/Shanghai
    volumes:
      # 首次启动自动执行建库建表脚本
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # 数据持久化到宿主机，容器删除数据不丢
      - mysql-data:/var/lib/mysql
    # 端口只在容器内部使用，不映射到宿主机，避免与用户本机 MySQL 冲突
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    container_name: corepulse-redis
    restart: unless-stopped
    # 数据持久化到宿主机
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  corepulse:
    image: corepulse:latest
    container_name: corepulse-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 连接容器内的 MySQL / Redis
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # LLM API Key 从 .env 读取
      WECHAT_API_KEY: ${WECHAT_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    ports:
      - "927:927"

volumes:
  mysql-data:
  redis-data: