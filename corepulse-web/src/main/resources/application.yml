server:
  port: 0927

spring:
  application:
    name: corepulse
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库地址/端口/密码从环境变量读取；默认 localhost 便于本地开发，Docker 中通过 .env 覆盖
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/pc_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 数据库密码从环境变量读取（IDEA 中配置 MYSQL_PASSWORD）
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  web:
    resources:
      # 前端静态资源：优先从外部目录加载（Docker 中挂载前端 dist），本地无此目录时回退到 classpath
      static-locations: file:/app/static/,classpath:/static/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # ==================== LLM 配置（OpenAI 协议兼容厂商） ====================
corepulse:
  llm:
    primary:
      base-url: https://chatapi.weixin.qq.com/openai/v1
      api-key: ${WECHAT_API_KEY}
      model: Deepseek-v4-flash
      temperature: 0.7
    backup:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model: deepseek-v4-flash
      temperature: 0.7
  # ==================== RAG 个人知识库配置 ====================
  rag:
    embedding:
      # 阿里百炼 Embedding API Key 从环境变量读取（IDEA 中配置 DASHSCOPE_API_KEY）
      api-key: ${DASHSCOPE_API_KEY}
      # Embedding 模型
      model: qwen3.7-text-embedding
    knowledge:
      # 知识库 MD 文档路径（classpath）
      path: classpath:knowledge/电脑维修指南_v3.md
    vector-store:
      # 向量数据持久化文件
      file: ${user.home}/.corepulse/vector-store.json

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.corepulse: debug
    org.springframework.ai.chat.client: debug
