server:
  port: 0927

spring:
  application:
    name: corepulse
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pc_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码从环境变量读取（IDEA 中配置 MYSQL_PASSWORD）
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # ==================== LLM 配置（OpenAI 协议兼容厂商） ====================
corepulse:
  llm:
    primary:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model: deepseek-chat
      temperature: 0.7
    backup:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      model: qwen3.8-max
      temperature: 0.7
  # ==================== RAG 个人知识库配置 ====================
  rag:
    embedding:
      # 阿里百炼 Embedding API Key 从环境变量读取（IDEA 中配置 DASHSCOPE_API_KEY）
      api-key: ${DASHSCOPE_API_KEY}
      # Embedding 模型
      model: qwen3.7-text-embedding
    knowledge:
      # 知识库 MD 文档路径（classpath）
      path: classpath:knowledge/电脑维修指南_v3.md
    vector-store:
      # 向量数据持久化文件
      file: ${user.home}/.corepulse/vector-store.json

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.corepulse: debug
    org.springframework.ai.chat.client: debug
