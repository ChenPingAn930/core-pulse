server:
  port: 0927

spring:
  application:
    name: corepulse
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pc_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # ==================== Spring AI 配置 (OpenAI 协议兼容 DeepSeek) ====================
  # 注意: base-url 不要带 /v1, Spring AI 会自动拼接 /v1/chat/completions
  ai:
    openai:
      base-url: https://api.deepseek.com
      # 优先读环境变量 DEEPSEEK_API_KEY，未设置时使用默认值
      api-key: ${DEEPSEEK_API_KEY:sk-edaeb307ae294d08981dd69beb5305fd}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

# ==================== Agent(Hermes) 配置 ====================
corepulse:
  agent:
    # Hermes 可执行文件路径（在 PATH 中可直接写 hermes）
    hermes-path: hermes

  # ==================== RAG 个人知识库配置 ====================
  rag:
    embedding:
      # 阿里百炼 Embedding API Key（优先读环境变量，未设置时用默认值）
      api-key: ${DASHSCOPE_API_KEY:sk-117936cbeb924f869c2bc08a0e6fe89f}
      # Embedding 模型
      model: qwen3.7-text-embedding
    knowledge:
      # 知识库 MD 文档路径（classpath）
      path: classpath:knowledge/电脑维修指南_v3.md
    vector-store:
      # 向量数据持久化文件
      file: ${user.home}/.corepulse/vector-store.json

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.corepulse: debug
    org.springframework.ai.chat.client: debug
