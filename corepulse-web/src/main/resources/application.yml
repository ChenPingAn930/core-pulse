server:
  port: 0927

spring:
  application:
    name: corepulse
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pc_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  rabbitmq:
    host: 192.168.191.128
    port: 5672
    username: itheima
    password: "123321"
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # ==================== Spring AI 配置 (OpenAI 协议兼容 DeepSeek) ====================
  # 注意: base-url 不要带 /v1, Spring AI 会自动拼接 /v1/chat/completions
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.corepulse: debug
    org.springframework.ai.chat.client: debug
